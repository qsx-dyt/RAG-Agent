services:
  # ---- 外部 Milvus 复用(不在此启动)----
  # 若你想改回 compose 自带 Milvus:取消下面 etcd/minio/milvus-standalone 的注释,
  # 并删除 api 里 MILVUS_HOST: host.docker.internal 一行,恢复 MILVUS_HOST: milvus-standalone。

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      MILVUS_HOST: host.docker.internal
      MILVUS_PORT: 19530
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pg_data:
